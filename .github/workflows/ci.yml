name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q graph_steps app.py example.py benchmark.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark smoke check
        run: python benchmark.py --nodes 20 --repeat 1
